# Publishes zb-client-accelerator-fork to nuget.org when a GitHub Release is published,
# or when a version tag is pushed (v*), so a UI Release is not strictly required.
#
# Repository secret required: NUGET_API_KEY — API key from https://www.nuget.org/account/apikeys
#
# If the workflow never appears in the Actions tab:
# - Published Release only: event "release" with type "published" runs after "Publish release", not while the release is Draft.
# - Tag-only: pushing tag v1.0.0 without a GitHub Release still runs this workflow via the push.tags trigger.
# - Forks: enable Actions under Settings → Actions → General (workflows are often disabled by default on forks).
# Publishing a Release that creates a new v* tag may start two runs (release + push); NuGet push uses --skip-duplicate.

name: Publish zb-client-accelerator-fork to NuGet

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Resolve package version from tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="${{ github.ref_name }}"
          fi
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Zeebe.Client.Accelerator.Fork.sln

      # Explicit build so all TargetFrameworks (net8/net9/net10) exist on disk before pack.
      # pack --no-restore alone can hit NU5026 (assembly to pack not found) on multi-target projects.
      - name: Build
        run: >
          dotnet build Zeebe.Client.Accelerator/Zeebe.Client.Accelerator/Zeebe.Client.Accelerator.csproj
          -c Release
          --no-restore
          -p:GeneratePackageOnBuild=false

      - name: Pack
        run: >
          dotnet pack Zeebe.Client.Accelerator/Zeebe.Client.Accelerator/Zeebe.Client.Accelerator.csproj
          -c Release
          --no-restore
          --no-build
          -p:PackageVersion=${{ steps.version.outputs.version }}
          -p:Version=${{ steps.version.outputs.version }}
          -o "${{ github.workspace }}/artifacts"

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >
          dotnet nuget push "${{ github.workspace }}/artifacts"/zb-client-accelerator-fork.*.nupkg
          -k "$NUGET_API_KEY"
          -s https://api.nuget.org/v3/index.json
          --skip-duplicate
